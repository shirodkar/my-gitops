kind: BuildConfig
apiVersion: build.openshift.io/v1
metadata:
  name: eap8-openjdk21-builder-custom
spec:
  output:
    to:
      kind: DockerImage
      name: 'quay.io/rh_ee_sshirodk/eap8-openjdk21-builder-custom:latest'
  successfulBuildsHistoryLimit: 1
  failedBuildsHistoryLimit: 1
  strategy:
    type: Docker
    dockerStrategy:
      from:
        kind: DockerImage
        name: 'registry.redhat.io/jboss-eap-8/eap8-openjdk21-builder-openshift-rhel9:latest'
      pullSecret:
        name: quay-secret
  source:
    type: Dockerfile
    dockerfile: |-
      FROM registry.redhat.io/jboss-eap-8/eap8-openjdk21-builder-openshift-rhel9:latest
      USER root
      RUN microdnf install -y git && microdnf clean all
      USER 185
  triggers:
    - type: ConfigChange
  runPolicy: Serial
---
kind: BuildConfig
apiVersion: build.openshift.io/v1
metadata:
  name: eap8-honey-bees-build-artifacts
spec:
  output:
    to:
      kind: DockerImage
      name: 'quay.io/rh_ee_sshirodk/eap8-honey-bees-build-artifacts:latest'
    pushSecret:
      name: quay-secret
  successfulBuildsHistoryLimit: 1
  failedBuildsHistoryLimit: 1
  strategy:
    type: Source
    sourceStrategy:
      from:
        kind: DockerImage
        name: 'quay.io/rh_ee_sshirodk/eap8-openjdk21-builder-custom:latest'
      pullSecret:
        name: quay-secret
      env:
        - name: CUSTOM_INSTALL_DIRECTORIES
          value: extensions
        - name: MAVEN_S2I_ARTIFACT_DIRS
          value: ear/target
      incremental: true
      forcePull: true
  source:
    type: Git
    git:
      uri: 'https://github.com/shirodkar/honey-bees-ear.git'
      ref: eap8.1
  triggers:
    - type: ConfigChange
  runPolicy: Serial
---
kind: BuildConfig
apiVersion: build.openshift.io/v1
metadata:
  name: eap8-honey-bees
spec:
  output:
    to:
      kind: DockerImage
      name: 'quay.io/rh_ee_sshirodk/eap8-honey-bees:latest'
    pushSecret:
      name: quay-secret
  successfulBuildsHistoryLimit: 1
  failedBuildsHistoryLimit: 1
  strategy:
    type: Docker
    dockerStrategy:
      from:
        kind: DockerImage
        name: 'registry.redhat.io/jboss-eap-8/eap8-openjdk21-runtime-openshift-rhel9:latest'
      pullSecret:
        name: my-pull-secret
  source:
    type: Dockerfile
    dockerfile: |-
      FROM registry.redhat.io/jboss-eap-8/eap8-openjdk21-runtime-openshift-rhel9:latest
      COPY --chown=jboss:root /server $JBOSS_HOME
      RUN chmod -R ug+rwX $JBOSS_HOME
    images:
      - from:
          kind: DockerImage
          name: 'quay.io/rh_ee_sshirodk/eap8-honey-bees-build-artifacts:latest'
        paths:
          - sourcePath: /opt/server
            destinationDir: .
        pullSecret:
          name: quay-secret
  triggers:
    - type: ImageChange
      imageChange:
        from:
          kind: ImageStreamTag
          name: 'eap8-honey-bees-build-artifacts:latest'
  runPolicy: Serial
