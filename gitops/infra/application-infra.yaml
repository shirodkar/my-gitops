apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  destination:
    server: 'https://kubernetes.default.svc'
  project: default
  source:
    repoURL: 'https://github.com/shirodkar/my-gitops.git'
    targetRevision: HEAD
    path: manifests/helm/infra
    helm:
      parameters:
        - name: namespaces[0]
          value: hello-world-s2i
        - name: namespaces[1]
          value: hello-world-deploy
        - name: namespaces[2]
          value: honey-bees-s2i
        - name: namespaces[3]
          value: honey-bees-deploy
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
  ignoreDifferences:
    - kind: ServiceAccount
      jsonPointers:
        - /imagePullSecrets