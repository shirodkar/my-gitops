apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: shared-app-project
  namespace: shared-gitops
spec:
  clusterResourceBlacklist:
    - group: '*'
      kind: '*'
  description: Hello World App Project
  destinations:
    - namespace: '*'
      server: '*'
  namespaceResourceBlacklist:
    - group: ''
      kind: ResourceQuota
    - group: ''
      kind: LimitRange
    - group: operators.coreos.com
      kind: '*'
    - group: operator.openshift.io
      kind: '*'
    - group: storage.k8s.io
      kind: '*'
  sourceRepos:
    - '*'
  roles:
    - description: Developer
      groups:
      - developers
      name: devops-admin
      policies:
      - p, proj:shared-app-project:devops-admin, applications, *, shared-app-project/*, allow
      - p, proj:shared-app-project:devops-admin, exec, create, shared-app-project/*, allow