apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-eso-auth
  namespace: openbao
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  destination:
    namespace: openbao
    server: 'https://kubernetes.default.svc'
  project: default
  source:
    chart: openbao
    repoURL: 'https://openbao.github.io/openbao-helm'
    targetRevision: 0.28.3
    helm:
      values: |
        global:
          openshift: true
        injector:
          enabled: false
        server:
          standalone:
            enabled: true
            config: |
              ui = true
              listener "tcp" {
                tls_disable = 1
                address = "[::]:8200"
                cluster_address = "[::]:8201"
              }
              storage "file" {
                path = "/openbao/data"
              }
          authDelegator:
            enabled: true
          dataStorage:
            enabled: true
            size: 1Gi
        ui:
          enabled: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
---
# Post-deploy manual steps (run inside the OpenBao pod after init/unseal):
#
#   bao secrets enable -version=2 -path=secrets kv
#   bao auth enable kubernetes
#   bao write auth/kubernetes/config \
#       kubernetes_host=https://$KUBERNETES_SERVICE_HOST:$KUBERNETES_SERVICE_PORT
#   bao policy write eso-policy - <<EOF
#   path "secrets/data/*" {
#     capabilities = ["read"]
#   }
#   path "secrets/metadata/*" {
#     capabilities = ["list"]
#   }
#   EOF
#   bao write auth/kubernetes/role/eso-role \
#       bound_service_account_names=openbao-eso-auth \
#       bound_service_account_namespaces=openbao \
#       policies=eso-policy \
#       ttl=1h
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-secret-store
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  provider:
    vault:
      server: 'http://openbao.openbao.svc.cluster.local:8200'
      path: secrets
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-role
          serviceAccountRef:
            name: openbao-eso-auth
            namespace: openbao
