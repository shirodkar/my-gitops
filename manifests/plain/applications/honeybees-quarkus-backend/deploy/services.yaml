kind: Service
apiVersion: v1
metadata:
  name: honey-bees-quarkus-backend
spec:
  ports:
    - name: 8080-tcp
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: 8443-tcp
      protocol: TCP
      port: 8443
      targetPort: 8443
  type: ClusterIP
  sessionAffinity: None
  selector:
    app: honey-bees-quarkus-backend
    deployment: honey-bees-quarkus-backend