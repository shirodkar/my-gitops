apiVersion: org.eclipse.che/v2
kind: CheCluster
metadata:
  name: devspaces
  namespace: openshift-devspaces
spec:
  components:
    cheServer:
      debug: false
      logLevel: INFO
    pluginRegistry:
      openVSXURL: ''
    dashboard: {}
    devWorkspace: {}
    imagePuller:
      enable: false
  containerRegistry: {}
  devEnvironments:
    startTimeoutSeconds: 600
    defaultEditor: che-incubator/che-code/latest
    defaultComponents:
      - name: dev
        container:
          sourceMapping: /projects
    storage:
      pvcStrategy: per-user
  gitServices: {}
  networking: {}
